<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hesap Aktivasyonu</title>
  <link rel="stylesheet" href="/css/public.css">
</head>
<body>
  <header class="public-header">
    <div class="brand"><img src="/img/mtu-amblem.png" alt="MTÜ amblemi"><span>Hesap Aktivasyonu</span></div>
    <a href="/">Giriş</a>
  </header>
  <main class="public-shell">
    <section class="public-panel">
      <h1>Şifrenizi Belirleyin</h1>
      <form id="activationForm" class="public-form">
        <label>Referans Kodu<input name="referenceCode" id="activationReference" required maxlength="32"></label>
        <label>Aktivasyon Tokenı<input name="token" id="activationToken" required></label>
        <label>Yeni Şifre<input name="password" type="password" required minlength="6" maxlength="100"></label>
        <button type="submit">Hesabı Aktive Et</button>
      </form>
      <p id="activationState" class="status"></p>
    </section>
  </main>
  <script src="/js/public-common.js?v=20260901"></script>
  <script src="/js/account-activation.js?v=20260901"></script>
</body>
</html>
