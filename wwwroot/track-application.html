<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Başvuru Takip</title>
  <link rel="stylesheet" href="/css/public.css">
</head>
<body>
  <header class="public-header">
    <div class="brand"><img src="/img/mtu-amblem.png" alt="MTÜ amblemi"><span>Başvuru Takip</span></div>
    <a href="/?application=1">Yeni Başvuru</a>
  </header>
  <main class="public-shell">
    <section class="public-panel">
      <h1>Başvuru Durumu</h1>
      <form id="trackForm" class="public-form">
        <label>Referans Kodu<input name="referenceCode" id="trackReference" required maxlength="32"></label>
        <label>Takip Tokenı<input name="token" id="trackToken" required></label>
        <button type="submit">Durumu Görüntüle</button>
      </form>
      <p id="trackState" class="status"></p>
      <div id="trackResult"></div>
      <form id="missingInfoForm" class="public-form missing-info-form" enctype="multipart/form-data" hidden>
        <input type="hidden" name="referenceCode" id="missingReference">
        <input type="hidden" name="token" id="missingToken">
        <label>Açıklama<textarea name="note" maxlength="1000" placeholder="Güncel açıklamanızı yazın"></textarea></label>
        <label>Yeni Belge<input name="document" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"></label>
        <button type="submit">Ek Bilgileri Gönder</button>
      </form>
    </section>
  </main>
  <script src="/js/public-common.js?v=20260901"></script>
  <script src="/js/application-tracking.js?v=20260901"></script>
</body>
</html>
